---
# Step 3: kernel modules and sysctl parameters

- name: Load the br_netfilter kernel module
  modprobe:
    name: br_netfilter
    state: present

- name: Ensure br_netfilter loads at boot
  copy:
    content: "br_netfilter\n"
    dest: /etc/modules-load.d/br_netfilter.conf
    mode: '0644'

# Longhorn dependency
- name: Load the iscsi_tcp kernel module
  modprobe:
    name: iscsi_tcp
    state: present

- name: Ensure iscsi_tcp loads at boot
  copy:
    content: "iscsi_tcp\n"
    dest: /etc/modules-load.d/iscsi_tcp.conf
    mode: '0644'

# NFS storage dependency (nfs-subdir-external-provisioner)
- name: Load the nfs kernel module
  modprobe:
    name: nfs
    state: present

- name: Load the nfsd kernel module
  modprobe:
    name: nfsd
    state: present

- name: Ensure the nfs modules load at boot
  copy:
    content: "nfs\nnfsd\n"
    dest: /etc/modules-load.d/nfs.conf
    mode: '0644'

- name: Configure kernel parameters
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_set: yes
  loop:
    # --- Bridge & container networking (required) ---
    - {key: "net.bridge.bridge-nf-call-iptables",  value: "1"}
    - {key: "net.bridge.bridge-nf-call-ip6tables", value: "1"}
    - {key: "net.ipv4.ip_forward",                  value: "1"}
    # --- conntrack (required for high concurrency) ---
    - {key: "net.netfilter.nf_conntrack_max",       value: "1310720"}
    # --- TCP performance ---
    - {key: "net.ipv4.tcp_tw_reuse",                value: "1"}
    - {key: "net.core.somaxconn",                   value: "32768"}
    - {key: "net.ipv4.tcp_max_syn_backlog",         value: "32768"}
    - {key: "net.core.netdev_max_backlog",          value: "32768"}
    - {key: "net.ipv4.ip_local_port_range",         value: "1024 65535"}
    # --- Memory & OOM ---
    - {key: "vm.swappiness",                        value: "0"}
    - {key: "vm.overcommit_memory",                 value: "1"}
    - {key: "vm.panic_on_oom",                      value: "0"}
    # --- Filesystem & inotify ---
    - {key: "fs.file-max",                          value: "2097152"}
    - {key: "fs.inotify.max_user_instances",        value: "8192"}
    - {key: "fs.inotify.max_user_watches",          value: "524288"}
    # --- Panic & keyring (required by k8s / CIS) ---
    - {key: "kernel.panic",                         value: "10"}
    - {key: "kernel.keys.root_maxkeys",             value: "1000000"}
    - {key: "kernel.keys.root_maxbytes",            value: "25000000"}
