# ingress-nginx 值覆盖（ArgoCD 渲染时叠加在 chart 默认值之上）
# 与原 bootstrap/ingress-nginx/values.yaml 保持一致，并显式化原脚本的 --set 参数
controller:
  # 单节点：DaemonSet 而非 Deployment
  kind: DaemonSet
  # 单节点仅 1 核，requests 必须压低，否则与监控层叠加后超过 allocatable
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    nodePorts:
      http: 30080
      https: 30443
  admissionWebhooks:
    enabled: true
  metrics:
    enabled: false
  progressDeadlineSeconds: 600

  # 增强日志格式（对应 fluent-bit 的 ingress-nginx parser）
  config:
    log-format-upstream: >
      $remote_addr - $remote_user [$time_local] "$request"
      $status $body_bytes_sent "$http_referer"
      "$http_user_agent" "$http_x_forwarded_for"
      rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"
      us="$upstream_status" uaddr="$upstream_addr"
      host="$host" uri="$uri" args="$args"
      scheme="$scheme" server_protocol="$server_protocol"
      http_x_forwarded_proto="$http_x_forwarded_proto"
      ssl_protocol="$ssl_protocol" ssl_cipher="$ssl_cipher"
      pipe="$pipe"
    # 保留真实客户端 IP
    compute-full-forwarded-for: "true"
    use-forwarded-headers: "true"
    # 性能
    worker-processes: "auto"
    proxy-body-size: "100m"
