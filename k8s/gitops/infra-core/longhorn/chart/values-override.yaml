# Longhorn 值覆盖（ArgoCD 渲染时叠加在 chart 默认值之上）
# 与原 bootstrap/longhorn/install.sh 的 --set 参数一一对应
defaultSettings:
  # 单节点：1 副本（测试配置，节点故障会丢数据）
  replicaCount: 1

persistence:
  # 不抢占默认 StorageClass（默认由 nfs-client 承担）
  defaultStorageClass: false

csi:
  # k3s kubelet socket 路径，须与 k3s 实际 data-dir 一致
  kubeletRootDir: /var/lib/rancher/k3s/agent/kubelet

service:
  ui:
    type: NodePort
    nodePort: 30777

# 禁用 pre-upgrade 检查 Job。
# 该 Job 带 helm.sh/hook: pre-upgrade 注解，ArgoCD 的 hook 语义与 Helm 不同，
# 首次安装（无上一版本）时该 Job 会永远 Running，卡住整个 Application 的同步。
preUpgradeChecker:
  jobEnabled: false
