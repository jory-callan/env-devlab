# MetalLB IP 地址池（L2 模式）
# 与 bootstrap/metallb/pool.yaml 内容一致，此处为 GitOps 层的唯一来源
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.5.252-192.168.5.253
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool
