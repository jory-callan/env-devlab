# AppProject — 三层权限隔离
# 由 root App-of-Apps 同步。同仓库多目录，用 namespace + clusterResource 白名单做隔离。
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra-core
  namespace: argocd
spec:
  sourceRepos:
    - "*" # 同仓库单目录，无法按路径限制；隔离靠 namespace + clusterResource 白名单
  destinations:
    - namespace: metallb-system
      server: "*"
    - namespace: ingress-nginx
      server: "*"
    - namespace: cert-manager
      server: "*"
    - namespace: nfs-storageclass
      server: "*"
    - namespace: longhorn-system
      server: "*"
    # cert-manager 的 leader election Role/RoleBinding 落在 kube-system
    - namespace: kube-system
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  sourceRepos:
    - "*"
  destinations:
    - namespace: monitoring
      server: "*"
    # victoria-metrics-operator 的 core-dns 组件部署到 kube-system
    - namespace: kube-system
      server: "*"
  clusterResourceWhitelist:
    # Operator 需要创建自身的 CRD
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    # Operator 需要创建 RBAC
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    # Operator 需要创建 webhook
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    # Operator 需要创建 ServiceAccount
    - group: ""
      kind: ServiceAccount
    # Operator 的自定义资源
    - group: operator.victoriametrics.com
      kind: "*"
    - group: monitoring.coreos.com
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  sourceRepos:
    - "*"
  destinations:
    - namespace: apps
      server: "*"
  clusterResourceWhitelist: [] # 业务应用不得创建集群级资源
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
