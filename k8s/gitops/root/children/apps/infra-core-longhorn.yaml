# infra-core 层 — Longhorn
# 分布式块存储，资源占用较重，放最后
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra-core
  sources:
    - repoURL: ssh://git@github.com/jory-callan/env-devlab.git
      targetRevision: main
      path: k8s/gitops/infra-core/longhorn/chart
      helm:
        releaseName: longhorn
        valueFiles:
          - values-override.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
