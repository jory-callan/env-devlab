# apps 层示例 — hello-world
# 演示业务应用如何通过 GitOps 声明式交付
#
# 注意: 不声明 Namespace。
#   AppProject "apps" 的 clusterResourceWhitelist 为空 —— 业务应用层不允许创建集群级资源
#   （Namespace 属集群级）。namespace 由 bootstrap 阶段预建，apps 层只管其中的工作负载。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: hello-world
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: internal-ca
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hello.czw-sre.internal
      secretName: hello-world-tls
  rules:
    - host: hello.czw-sre.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 80
