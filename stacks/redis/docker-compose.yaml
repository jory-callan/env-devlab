services:
  redis6:
    image: redis:6.2-alpine
    container_name: redis6
    restart: always
    # Alternative to bridge networking: network_mode: host
    networks:
      - net-shared
    ports:
      # Host 6378 -> container 6379
      - '6378:6379'
    volumes:
      - ${ROOT_DIR}/data:/data
      - ${ROOT_DIR}/conf/redis.conf:/etc/redis/redis.conf
    ulimits:
      # rtprio: 95
      memlock: -1
    command:
      # The password is injected from .env as a CLI argument; redis.conf
      # itself stays free of credentials.
      redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-Admin123}

networks:
  net-shared:
    external: true
