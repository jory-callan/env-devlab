# Default HTTP server: reject all requests
server {
    listen 80 default_server;        # IPv4 port 80, default server
    listen [::]:80 default_server;   # IPv6 port 80, default server

    # Hide the nginx version
    server_tokens off;

    # Silently close the connection; recommended for HTTPS-only setups
    # return 444;

    # Permanently redirect all HTTP requests to HTTPS
    # $host:        the requested hostname
    # $request_uri: the full request URI including query arguments
    return 301 https://$host$request_uri;
}

# Default HTTPS server: reject all requests
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _; # matches any hostname (default server)

    # SSL certificate paths (self-signed default certificate)
    ssl_certificate ssl/default.crt;
    ssl_certificate_key ssl/default.key;
    # Recommended security hardening:
    # Disable unsafe protocol versions
    ssl_protocols TLSv1.2 TLSv1.3;
    # SSL cipher suite
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    # Enable the SSL session cache
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    return 444;
}
