# Alternative nginx.conf for the anotherconfig/ configuration set.
# This set is NOT mounted by docker-compose.yaml (which uses ../nginx.conf).
# To use it: cp anotherconfig/nginx.conf ./nginx.conf and copy the
# anotherconfig/conf.d/ contents over conf.d/.

# User and process configuration
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Event module configuration
events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# HTTP module configuration
http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # Security settings
    server_tokens off;

    # Request rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Include all configuration files from the conf.d directory
    include /etc/nginx/conf.d/*.conf;

    # Include configuration files from the sites-enabled directory
    # include /etc/nginx/sites-enabled/*;

}
