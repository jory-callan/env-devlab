# xxx.example.com: PHP application behind FastCGI with HTTP->HTTPS redirect.
# (alternative configuration set)

server {
    listen 80;
    listen [::]:80;
    server_name xxx.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xxx.example.com;
    http2 on;

    root /data/app/testapp/xxx.example.com/public;
    index index.html index.htm index.php;
    error_page 500 502 503 504 /50x.html;

    include conf.d/00-security.config;

    # SSL
    ssl_certificate ssl/example.com.pem;
    ssl_certificate_key ssl/example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    # ssl_dhparam ssl/dhparam.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location = /favicon.ico {
        return 204;
        access_log     off;
        log_not_found  off;
    }

    location = /50x.html {
        root    html;
    }

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
        add_header Access-Control-Max-Age 3600 always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Front controller rewrite
        if (!-e $request_filename){
            rewrite  ^(.*)$  /index.php?s=$1 last;   break;
        }
    }

    # Static assets: permissive CORS + 30-day browser cache
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|flv|mp4|ico)$ {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, token, platform';
        expires 30d;
        access_log off;
    }

    location ~ .+\.php($|/) {
        set $script    $uri;
        set $path_info  "/";
        if ($uri ~ "^(.+\.php)(/.+)") {
            set $script     $1;
            set $path_info  $2;
        }
        include conf.d/00-cors.config;
        fastcgi_pass phpfpm74:9000;
        fastcgi_index  index.php?IF_REWRITE=1;
        include fastcgi_params;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param SCRIPT_FILENAME  $document_root$script;
        fastcgi_param SCRIPT_NAME $script;
    }

    access_log  /var/log/nginx/xxx.example.com_access.log  main;
    error_log /var/log/nginx/xxx.example.com_error.log error;
}
