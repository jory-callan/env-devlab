# Default HTTP/HTTPS servers: reject all unmatched requests
# (alternative configuration set).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Hide the nginx version
    server_tokens off;

    # Silently close the connection
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Reject the TLS handshake for unknown hostnames
    ssl_reject_handshake on;

    # Hide the nginx version
    server_tokens off;

    return 444;
}
