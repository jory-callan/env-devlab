# Usage examples:
# 1. Modify the log file path (/var/log/java-app/*.log)
# 2. Adjust the service name (service java-app)
# 3. Modify the TCP port (Port 5170)
# 4. Adjust the regular expressions to your actual log format
# 5. Add or remove filter rules
# 6. Choose the appropriate OUTPUT configuration and uncomment it

