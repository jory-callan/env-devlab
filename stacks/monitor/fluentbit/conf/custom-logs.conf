# Custom log collection configuration template
# Copy this file and adapt it to your requirements

# ====== Dedicated configuration template files ======
# To use the log collection configurations below, copy the contents of the corresponding template file:
# 
# 1. Nginx log collection: nginx-logs-template.conf
# 2. Java log collection: java-logs-template.conf
#
# How to use:
# - Copy the contents of the corresponding template into this file or fluent-bit.conf
# - Adjust paths, tags and other settings to your environment
# - Uncomment the configuration sections you need

# ====== General log collection examples ======

# Example 1: collect a generic application log file
# [INPUT]
#     Name              tail
#     Tag               app.logs
#     Path              /var/log/your-app/*.log
#     Parser            your_app_parser
#     DB                /tmp/flb_app.db
#     Mem_Buf_Limit     20MB
#     Skip_Long_Lines   On
#     Refresh_Interval  5
#     storage.type      filesystem

# Example 3: collect system logs
# [INPUT]
#     Name              tail
#     Tag               system.logs
#     Path              /var/log/messages
#     Parser            syslog
#     DB                /tmp/flb_system.db
#     Mem_Buf_Limit     10MB
#     Skip_Long_Lines   On
#     Refresh_Interval  10
#     storage.type      filesystem

# ====== Network log collection examples ======

# Example 4: receive logs over TCP
# [INPUT]
#     Name              tcp
#     Tag               tcp.logs
#     Listen            0.0.0.0
#     Port              5170
#     Format            json
#     storage.type      filesystem

# Example 5: receive syslog over UDP
# [INPUT]
#     Name              syslog
#     Mode              udp
#     Listen            0.0.0.0
#     Port              5140
#     Parser            syslog-rfc3164
#     Tag               syslog.udp
#     storage.type      filesystem

# ====== Custom parser examples ======

# Generic application log parser
# [PARSER]
#     Name         your_app_parser
#     Format       regex
#     Regex        ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \[(?<level>\w+)\] (?<message>.*)$
#     Time_Key     time
#     Time_Format  %Y-%m-%d %H:%M:%S

# JSON log format parser
# [PARSER]
#     Name         json_parser
#     Format       json
#     Time_Key     timestamp
#     Time_Format  %Y-%m-%dT%H:%M:%S.%L
#     Time_Keep    On

# ====== Log filtering and processing examples ======

# Add tags to custom logs
# [FILTER]
#     Name          modify
#     Match         app.logs
#     Add           service your-app-name
#     Add           environment production
#     Add           log_type application

# Filter specific content
# [FILTER]
#     Name          grep
#     Match         app.logs
#     Exclude       message healthcheck
#     Exclude       message ping

# Parse JSON log fields
# [FILTER]
#     Name          parser
#     Match         app.logs
#     Key_Name      message
#     Parser        json_parser
#     Reserve_Data  On

# Rename fields
# [FILTER]
#     Name          modify
#     Match         app.logs
#     Rename        msg message
#     Rename        lvl level

# ====== Usage notes ======
# 1. Uncomment the configuration blocks matching your log type and location
# 2. Modify the Path parameter to point at your actual log file paths
# 3. Adjust Tag names to distinguish log sources in Grafana
# 4. Adjust the parsers to match your log formats
# 5. Restart Fluent Bit after saving so the configuration takes effect

# ====== Test the configuration ======
# Use the following command to verify the configuration is correct:
# docker exec fluentbit /opt/fluent-bit/bin/fluent-bit --config /fluent-bit/etc/fluent-bit.conf --dry-run 