# ====== Nginx log collection configuration template ======
# Copy the contents of this file into fluent-bit.conf or a separate configuration file to use

# ====== INPUT configuration ======

# Nginx access log collection
[INPUT]
    Name              tail
    Tag               nginx.access
    Path              /var/log/nginx/access.log
    Parser            nginx_access
    DB                /tmp/flb_nginx_access.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    storage.type      filesystem

# Nginx error log collection
[INPUT]
    Name              tail
    Tag               nginx.error
    Path              /var/log/nginx/error.log
    Parser            nginx_error
    DB                /tmp/flb_nginx_error.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  5
    storage.type      filesystem

# ====== PARSER configuration ======

# Nginx access log parser
[PARSER]
    Name         nginx_access
    Format       regex
    Regex        ^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
    Time_Key     time
    Time_Format  %d/%b/%Y:%H:%M:%S %z

# Nginx error log parser
[PARSER]
    Name         nginx_error
    Format       regex
    Regex        ^(?<time>[^ ]+ [^ ]+) \[(?<level>[^\]]+)\] (?<pid>[^#]+)#(?<tid>[^:]+): (?<message>.*)$
    Time_Key     time
    Time_Format  %Y/%m/%d %H:%M:%S

# ====== FILTER configuration ======

# Nginx log tag processing
[FILTER]
    Name          modify
    Match         nginx.*
    Add           service nginx
    Add           log_type nginx
    Add           environment production

[FILTER]
    Name          record_modifier
    Match         nginx.access
    Record        service nginx
    Record        log_type access
    Record        source_type file

[FILTER]
    Name          record_modifier
    Match         nginx.error
    Record        service nginx
    Record        log_type error
    Record        source_type file

# Filter health check requests
[FILTER]
    Name          grep
    Match         nginx.access
    Exclude       path /health
    Exclude       path /ping
    Exclude       user_agent kube-probe

# Status code classification
[FILTER]
    Name          modify
    Match         nginx.access
    Condition     Key_value_matches code ^2
    Add           status_category success

[FILTER]
    Name          modify
    Match         nginx.access
    Condition     Key_value_matches code ^3
    Add           status_category redirect

[FILTER]
    Name          modify
    Match         nginx.access
    Condition     Key_value_matches code ^4
    Add           status_category client_error

[FILTER]
    Name          modify
    Match         nginx.access
    Condition     Key_value_matches code ^5
    Add           status_category server_error

# ====== OUTPUT configuration ======

# Send to VictoriaLogs (remote deployment + basic auth)
[OUTPUT]
    Name              http
    Match             nginx.*
    Host              192.168.1.100
    Port              9428
    URI               /insert/jsonline?_stream_fields=service,log_type,host&_msg_field=message&_time_field=time
    Format            json_lines
    Json_date_key     time
    Json_date_format  iso8601
    Header            Content-Type application/stream+json
    Header            Authorization Basic dXNlcjpwYXNzd29yZA==
    # The Authorization header above is the Base64 encoding of user:password
    # Generate it with: echo -n 'your_username:your_password' | base64
    # Replace the Base64 string above with the encoding of your own credentials
    tls               off
    tls.verify        off
    compress          gzip
    Retry_Limit       3
    workers           2
    storage.total_limit_size 100M

