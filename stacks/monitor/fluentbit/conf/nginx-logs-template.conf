# Usage examples:
# 1. Modify the log file path (/var/log/nginx/*.log)
# 2. Adjust the environment tag (environment)
# 3. Add or remove filters as needed
# 4. Make sure the nginx log format matches the parser
# 5. Choose the appropriate OUTPUT configuration and uncomment it
