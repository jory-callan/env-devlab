apiVersion: 1

deleteDatasources:
  - name: VictoriaLogs
    orgId: 1

datasources:
  - name: VictoriaLogs
    type: prometheus
    uid: victorialogs
    access: proxy
    url: http://victorialogs:9428/select/logsql
    isDefault: true
    editable: true
    orgId: 1
    version: 1
    jsonData:
      httpMethod: POST
      manageAlerts: true
      timeInterval: 30s
      queryTimeout: 60s
    secureJsonData: {}

  - name: VictoriaLogs-LogQL
    type: loki
    uid: victorialogs-logql
    access: proxy
    url: http://victorialogs:9428
    isDefault: false
    editable: true
    orgId: 1
    version: 1
    jsonData:
      maxLines: 1000
      timeout: 60s
      httpHeaderName1: Content-Type
    secureJsonData:
      httpHeaderValue1: application/json
