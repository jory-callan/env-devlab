services:
  questdb:
    image: questdb/questdb:9.4.0
    container_name: questdb
    restart: always
    networks:
      - net-shared
    environment:
      - TZ=Asia/Shanghai
      # Disable telemetry
      - QDB_TELEMETRY_ENABLED=false
      # PostgreSQL wire protocol authentication (configure in production)
      - QDB_PG_ENABLED=true
      - QDB_PG_USER=${QDB_PG_USER:-admin}
      - QDB_PG_PASSWORD=${QDB_PG_PASSWORD:-Admin123}
      - QDB_PG_READONLY_USER_ENABLED=${QDB_PG_READONLY_USER_ENABLED:-true}
      - QDB_PG_READONLY_USER=${QDB_PG_READONLY_USER:-viewer}
      - QDB_PG_READONLY_PASSWORD=${QDB_PG_READONLY_PASSWORD:-Admin123}
      # HTTP API authentication (Basic Auth, applies to the API only)
      - QDB_HTTP_ENABLED=${QDB_HTTP_ENABLED:-true}
      - QDB_HTTP_USER=${QDB_HTTP_USER:-admin}
      - QDB_HTTP_PASSWORD=${QDB_HTTP_PASSWORD:-Admin123}
      - QDB_HTTP_SECURITY_READONLY=${QDB_HTTP_SECURITY_READONLY:-true}
      # Custom JVM startup parameters (uncomment to tune)
      # - JVM_PREPEND=-XX:MaxRAMPercentage=75.0 -XX:InitRAMPercentage=50.0 -XX:+AlwaysPreTouch -XX:MaxDirectMemorySize=2g -XX:+UseG1GC
    volumes:
      - ${ROOT_DIR}/data:/var/lib/questdb
    ports:
      - "8812:8812" # PostgreSQL wire protocol (SQL queries and third-party tools)
      - "9000:9000" # HTTP API
      - "9003:9003" # InfluxDB line protocol (writes)
      - "9009:9009" # MinHealth check port (Consul and similar service discovery)
    # --- Resource limits (required in production) ---
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    # --- Shared memory ---
    # QuestDB performance depends heavily on shared memory. On a Linux host,
    # make sure /proc/sys/kernel/shmmax is large enough (at least equal to
    # deploy.resources.limits.memory). shm_size below also matters for the
    # internal index.
    shm_size: '2gb'
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ulimits:
      memlock:
        soft: -1
        hard: -1

networks:
  net-shared:
    external: true

# Host tuning for production (apply on the host, not in the container):
#   Raise the maximum number of file handles:
#     sysctl -w fs.file-max=1048576
#   Raise the maximum number of memory map areas (QuestDB relies on this):
#     sysctl -w vm.max_map_count=1048576
#   Persist both settings in /etc/sysctl.conf and reload with: sysctl -p
