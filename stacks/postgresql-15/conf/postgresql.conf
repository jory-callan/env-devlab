# PostgreSQL 15 reference tuning profile.
#
# NOTE: this file is NOT mounted by docker-compose.yaml. It is a reference
# profile carried over from the legacy docker-compose/ tree: it depends on
# pg_probackup and extensions (ptrack, pgaudit, pg_start_sql, pg_stat_kcache)
# that are not part of the official postgres:15.5-alpine3.17 image, so
# mounting it as-is would prevent the server from starting.
#
# To use it, install the missing extensions in the image (or a derived
# image), copy the file into the container, and add a mount such as:
#   - ${ROOT_DIR}/conf/postgresql.conf:/etc/postgresql/postgresql.conf
# The container then listens on the port configured below; keep it in sync
# with the compose port mapping (5432).

#------------------------------------------------------------------------------
# CONNECTIONS AND LISTEN
#------------------------------------------------------------------------------

# IP addresses the server listens on. '*' = all interfaces (dev lab only).
listen_addresses = '*'

# Listen port. NOTE: not mounted by default, the container uses the image
# default 5432, which is what the compose file publishes to the host.
port = 5423

# Maximum number of concurrent client connections (restart required)
max_connections = 100

#------------------------------------------------------------------------------
# MEMORY
#------------------------------------------------------------------------------

# Shared buffer cache. Should not exceed 1/4 of total RAM; 1/8 is typical.
shared_buffers = 128MB

# Method used for dynamic shared memory allocation
dynamic_shared_memory_type = posix

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL)
#------------------------------------------------------------------------------

# WAL detail level: minimal, replica, or logical
wal_level = replica

# Protect against partial page writes after a crash
full_page_writes = on

# Checkpoint WAL size limits: the checkpointer aims to keep WAL between
# min_wal_size and max_wal_size before triggering a checkpoint
max_wal_size = 1GB
min_wal_size = 80MB

#------------------------------------------------------------------------------
# ARCHIVE (requires pg_probackup, NOT available in the official image)
#------------------------------------------------------------------------------

# Continuous WAL archiving mode: off, on, or always
archive_mode = always

# Shell command used to archive each completed WAL segment
archive_command = '"pg_probackup" archive-push -B "/pgdata/pg_probackup" --instance pg14.2 --wal-file-name=%f --compress --archive-timeout=270'

# Force a WAL segment switch after this interval even when idle
archive_timeout = 900

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

# Log destinations: stderr and/or csvlog
log_destination = 'csvlog'

# Capture stderr/csvlog output into files (requires a restart to change)
logging_collector = on

# Directory for log files (relative to the data directory)
log_directory = 'log'

# Log file name pattern (strftime escapes)
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

# Log file permissions
log_file_mode = 0600

# Automatic log rotation: start a new file when older than this
log_rotation_age = 1d

# Automatic log rotation: start a new file when larger than this
log_rotation_size = 10MB

# Log each successful connection
log_connections = on

#------------------------------------------------------------------------------
# LOCALE AND FORMATTING
#------------------------------------------------------------------------------

# Time zone used for log timestamps and displayed/interpeted timestamps
log_timezone = 'PRC'
timezone = 'PRC'

# Date/time display format and ambiguous-date input rules
datestyle = 'iso, mdy'

# Locale used for system error messages and monetary/numeric/time formatting
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Default text search configuration
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# SHARED PRELOADED LIBRARIES (extensions must exist in the image)
#------------------------------------------------------------------------------

# Libraries loaded at server start. ptrack/pgaudit/pg_start_sql/
# pg_stat_kcache are NOT included in the official postgres image;
# pg_stat_statements and auto_explain ship with the contrib package.
shared_preload_libraries = 'ptrack, pgaudit, auto_explain, pg_start_sql, pg_stat_statements, pg_stat_kcache'

# ptrack: hash map size for the incremental backup tracker (pg_probackup)
ptrack.map_size = 64

# auto_explain: log plans of statements running longer than this
auto_explain.log_min_duration = '3s'
